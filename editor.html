<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit meetings · Gaussian Splatting</title><link rel="stylesheet" href="style.css"><script src="config.js" defer></script><script src="editor.js" defer></script></head><body><header class="top"><a class="brand" href="./">Gaussian Splatting</a><nav><a href="./">← Back to site</a></nav></header><main class="editor-main"><div class="editor-heading"><h1>Manage meetings.</h1><p class="lead">Add a meeting or update the archive.</p></div><div id="notice" class="notice" role="status"></div><section id="login" class="panel"><h2>Editor sign in</h2><p class="message">Sign in with an authorized GitHub account to add or edit meetings.</p><button id="signin" class="primary">Continue with GitHub ↗</button></section><div id="editor" class="hidden"><div class="panel"><div class="section-head"><div><p class="eyebrow">MEETING DETAILS</p><h2 id="form-title">Add a meeting</h2></div><button id="signout" class="link">Sign out</button></div><form id="form"><div class="form-grid"><label class="field full">Paper title <input name="title" required maxlength="200"></label><label class="field">Presenter <input name="presenter" required maxlength="120"></label><label class="field">Time zone <input name="timezone" list="zones" required placeholder="Europe/Stockholm"><datalist id="zones"></datalist><small>Use a time zone such as Europe/Stockholm.</small></label><label class="field">Starts <input name="start" type="datetime-local" required></label><label class="field">Ends <input name="end" type="datetime-local" required></label><label class="field full">Location or meeting link <input name="location" placeholder="Room or video call link"></label><label class="field full">Paper URL <input name="paper" type="url" placeholder="https://..."></label><label class="field full">Slides URL <input name="slides" type="url" placeholder="https://..."></label>


<label class="field full">
  Paper authors (optional)
  <input
    name="authors"
    maxlength="500"
    placeholder="Author 1, Author 2, Author 3"
  >
</label>

<label class="field full">
  Abstract (optional)
  <textarea
    name="abstract"
    rows="5"
    placeholder="Paste the paper abstract here..."
  ></textarea>
</label>




<label class="field full">Recording URL <input name="recording" type="url" placeholder="https://..."><small>File access is controlled where the recording is stored. Links saved here are public.</small></label><label class="field full">Transcript URL <input name="transcript" type="url" placeholder="https://..."></label></div><div class="form-actions"><button class="primary" type="submit">Save meeting</button><button id="calendar" class="button secondary" type="button">Create Google Calendar event ↗</button><button id="cancel" class="button secondary" type="button">Clear form</button><button id="delete" class="button secondary hidden" type="button">Delete meeting</button></div></form></div><section class="panel"><h2>All meetings</h2><div id="editor-list"></div></section></div></main><footer><span>Gaussian Splatting Discussion Group</span></footer></body></html>
